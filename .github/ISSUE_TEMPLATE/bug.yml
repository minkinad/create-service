name: Bug report
description: Report reproducible incorrect behavior
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    attributes:
      label: Description
      description: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Provide the smallest reproducible example.
    validations:
      required: true
  - type: input
    attributes:
      label: Node.js version
    validations:
      required: true
